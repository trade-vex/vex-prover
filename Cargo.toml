[package]
name = "vex-prover"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = 1

[dependencies]
stwo-prover = { git = "https://github.com/starkware-libs/stwo", rev = "0445252", features = ["parallel"] }
tracing = "0.1"
tracing-subscriber = "0.3"
num-traits = "0.2.19"
rayon = { version = "1.10.0", optional = true }

[features]
parallel = ["rayon"]

[dev-dependencies]
rand = "0.8.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "raw_insertions"
harness = false